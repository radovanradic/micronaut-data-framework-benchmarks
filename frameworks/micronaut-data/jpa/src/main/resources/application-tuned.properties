# tuned configuration (added on top of application.properties): the Hibernate settings commonly
# recommended for throughput. Identical to spring-data-jpa's tuned Hibernate settings.
#
# JDBC batching for inserts/updates/deletes; with IDENTITY ids Hibernate cannot batch inserts, so this
# mainly affects updates and deletes
jpa.default.properties.hibernate.jdbc.batch_size=50
jpa.default.properties.hibernate.order_inserts=true
jpa.default.properties.hibernate.order_updates=true
# pad IN-list parameters to powers of two so query plans are reused
jpa.default.properties.hibernate.query.in_clause_parameter_padding=true
