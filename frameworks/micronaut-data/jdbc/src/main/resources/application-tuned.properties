# tuned configuration (added on top of application.properties)
#
# Micronaut Data JDBC has no documented throughput settings beyond the defaults: queries are computed
# at compile time, saveAll already uses JDBC batching with generated keys, and since 5.3.0 reads
# outside a transaction no longer toggle the connection's read-only flag
# (datasources.*.read-only-connection-per-operation=false is the default).
# This configuration is therefore identical to the default one.
