# tuned configuration (added on top of application.properties)
#
# The Hibernate settings commonly recommended for throughput; identical to micronaut-data-jpa's tuned
# Hibernate settings. JDBC batching for inserts/updates/deletes (with IDENTITY ids Hibernate cannot
# batch inserts, so this mainly affects updates and deletes):
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# pad IN-list parameters to powers of two so query plans are reused
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
#
# Spring-specific: let Hibernate know the pool hands out connections with auto-commit already off, so it
# skips the getAutoCommit/setAutoCommit calls per transaction (Boot then sets
# hibernate.connection.provider_disables_autocommit=true itself).
spring.datasource.hikari.auto-commit=false
