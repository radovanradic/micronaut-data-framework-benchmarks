# tuned configuration (added on top of application.properties)
#
# Spring Data JDBC's one documented throughput option is single-query loading of aggregates
# (JdbcMappingContext#setSingleQueryLoadingEnabled), but it only applies to the CrudRepository find
# methods, not to derived queries; no scenario's aggregate with a collection is loaded that way
# (joinFetch uses a derived query), so it would change nothing. saveAll already batches inserts.
# This configuration is therefore identical to the default one.
